<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるい月</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,#1b2347 0%,#0b1029 70%,#060818 100%);color:#f3ecd8;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.sm{position:fixed;left:0;right:0;z-index:6;text-align:center;letter-spacing:.1em;pointer-events:none;transition:opacity 1.8s ease;text-shadow:0 0 14px #04152b}
#seaTop{top:calc(env(safe-area-inset-top,0px) + 7vh);font-size:19px;line-height:1.9}
#seaBot{bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);font-size:14px;opacity:.7}
.star{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5}
#stage{position:relative;width:min(43.4vw,182px);aspect-ratio:1;cursor:pointer;transition:opacity 2.4s ease}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(243,236,216,.28);filter:blur(1.5px);transition:box-shadow 2.4s,border-color 2.4s,filter 2.4s,opacity 2.4s}
.moon{position:absolute;inset:0;border-radius:50%;filter:blur(3px);background:radial-gradient(circle at 40% 38%,#fffaea,#f1e2b4 60%,#d9c58d);box-shadow:0 0 60px rgba(255,240,190,.35);transition:box-shadow 2.4s,filter 2.4s,opacity 2.4s}
.shade{position:absolute;inset:0;border-radius:50%;background:#0b1029;filter:blur(3px);-webkit-mask-image:linear-gradient(to right,#000 0%,#000 34%,transparent 66%);mask-image:linear-gradient(to right,#000 0%,#000 34%,transparent 66%);opacity:1;transition:opacity 2.4s ease,filter 2.4s ease}
#word{position:absolute;left:8%;top:50%;width:42%;text-align:center;transform:translateY(-50%);font-size:15px;opacity:0;color:#fff7dc;text-shadow:0 0 12px #ffe9a8;transition:opacity 2.4s 1s}
#msg{min-height:3.6em;width:min(84vw,380px);text-align:center;font-size:18px;line-height:1.9;letter-spacing:.08em;transition:opacity .8s}
#form{display:none;gap:8px;width:min(84vw,380px)}
#form input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(243,236,216,.35);border-radius:999px;color:inherit;padding:12px 18px;font:inherit;font-size:16px}
button{background:#f1e2b4;color:#0b1029;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-size:16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff7dc;outline-offset:3px}
#again{display:none;background:none;color:#f3ecd8;border:1px solid rgba(243,236,216,.35)}
.full .shade{opacity:0}.full .moon{box-shadow:0 0 110px rgba(255,240,190,.6)}.full .ring{border-color:transparent}.full #word{opacity:1}
.half .moon{filter:blur(20px);opacity:.5;box-shadow:0 0 70px rgba(255,236,190,.42)}
.half .shade{opacity:0;filter:blur(16px)}
.half .ring{opacity:.18;filter:blur(10px)}
.lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;line-height:1.7;letter-spacing:.08em;white-space:nowrap;pointer-events:none;font-style:italic;transition:color 2.4s}
.lbl-r{left:calc(100% + 16px);color:#f1e2b4}
.lbl-l{right:calc(100% + 16px);text-align:right;color:rgba(170,184,225,.75)}
.full .lbl-l{color:#f1e2b4}
#stage{isolation:isolate}
#hit{position:absolute;left:50%;top:50%;width:400%;height:400%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
#hitL,#hitR{position:absolute;top:0;width:50%;height:100%;cursor:pointer}
#hitL{left:0}
#hitR{right:0}
#msgwrap{position:relative;z-index:3;display:flex;justify-content:center;margin:24px 0;pointer-events:none}
#form,#again{position:relative;z-index:6}
#msg{position:relative;z-index:1;text-shadow:0 0 10px #0b1029,0 0 4px #0b1029}
body.moon #msgwrap,body.moon #form,body.moon #again{z-index:12}
#scene.on ~ #msgwrap #msg,#guard.on ~ #msgwrap #msg,#scene.on ~ #form,#guard.on ~ #form{background:rgba(10,10,30,.75);color:#fff;font-size:18px;font-weight:500;text-shadow:0 0 8px rgba(0,0,0,.6);filter:none;opacity:1;transition:none}
#scene.on ~ #msgwrap #msg,#guard.on ~ #msgwrap #msg{border-radius:16px;padding:12px 18px}
#scene.on ~ #form,#guard.on ~ #form{border-radius:16px;padding:10px 12px;z-index:12}
#scene.on ~ #form input,#guard.on ~ #form input,#scene.on ~ #form button,#guard.on ~ #form button{color:#fff;font-size:18px;font-weight:500;text-shadow:0 0 8px rgba(0,0,0,.6);opacity:1}
#scene.on ~ #form input,#guard.on ~ #form input{background:transparent;border-color:rgba(255,255,255,.45)}
#scene.on ~ #form input::placeholder,#guard.on ~ #form input::placeholder{color:rgba(255,255,255,.78);opacity:1}
#scene.on ~ #form button,#guard.on ~ #form button{background:transparent;border:1px solid rgba(255,255,255,.7)}
#gem{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;opacity:0;filter:blur(3.5px) saturate(.8);transition:opacity 2.4s;pointer-events:none}
#globe{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:-1;opacity:0;transform:translateY(0) scale(.1);transition:transform 3.4s cubic-bezier(.2,.7,.2,1) .3s,opacity 2.4s .3s;pointer-events:none;filter:drop-shadow(0 0 12px rgba(255,240,190,.6))}
#globe.on{opacity:1;transform:translateY(-150px) scale(1)}
.wave{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,236,170,.55);opacity:0;pointer-events:none;z-index:-1}
.spread .wave{animation:wv 6s ease-out infinite}
@keyframes wv{0%{transform:scale(1);opacity:.55}100%{transform:scale(4.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.spread .wave{animation:none}}
.tp{display:inline-block;border:1px solid rgba(243,236,216,.6);border-radius:999px;padding:6px 28px;font-size:16px;letter-spacing:.2em;animation:bt 2.4s ease-in-out infinite}
@keyframes bt{50%{background:rgba(243,236,216,.16);box-shadow:0 0 18px rgba(255,240,190,.4)}}
.pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,240,190,.7);opacity:0;pointer-events:none;z-index:-1}
#stage:not(.half):not(.full) .pulse{animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.tp,.pulse{animation:none!important}}
#scene{position:fixed;inset:0;z-index:4;width:100%;height:100%;object-fit:cover;object-position:center center;opacity:0;pointer-events:none;background:#15243f;transition:opacity 2.4s ease}
#scene.on{opacity:1}
#guard{position:fixed;z-index:4;left:50%;top:50%;width:min(92vw,calc(88vh * 3 / 4));height:min(88vh,calc(92vw * 4 / 3));transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity 2.8s ease}
#guard svg{display:block;width:100%;height:100%;overflow:visible}
#irisName{position:absolute;left:50%;top:3%;transform:translateX(-50%);margin:0;z-index:3;color:#fff;font-size:16px;font-weight:500;letter-spacing:.2em;text-shadow:0 0 8px rgba(0,0,0,.6);background:rgba(10,10,30,.75);border-radius:999px;padding:4px 12px;filter:none;opacity:1}
#irisFig{animation:irisFloat 6s ease-in-out infinite}
.iris-cloud{animation:cloudDrift 12s ease-in-out infinite}
.iris-cloud.b{animation-duration:14s;animation-delay:-3s}
.iris-glow{animation:glowPulse 7s ease-in-out infinite}
.iris-wing{transform-box:fill-box;transform-origin:30% 50%;animation:wingSway 8s ease-in-out infinite}
.iris-wing.r{transform-origin:70% 50%;animation-duration:8.5s}
.iris-cloth{transform-box:fill-box;transform-origin:50% 15%;animation:clothWave 7.5s ease-in-out infinite}
.iris-cloth.s{animation-duration:6.5s;animation-delay:-2s}
.iris-hair{transform-box:view-box;transform-origin:160px 140px;animation:hairSway 7s ease-in-out infinite}
@keyframes irisFloat{0%,100%{transform:translateY(7px)}50%{transform:translateY(-11px)}}
@keyframes cloudDrift{0%,100%{transform:translateX(-8px)}50%{transform:translateX(10px)}}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:.92}}
@keyframes wingSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes clothWave{0%,100%{transform:rotate(-3deg) translateX(-4px)}50%{transform:rotate(3.5deg) translateX(5px)}}
@keyframes hairSway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.8deg)}}
#guard.on{opacity:1}
@media (prefers-reduced-motion:reduce){#irisFig,.iris-cloud,.iris-glow,.iris-wing,.iris-cloth,.iris-hair{animation:none!important}}
#guard.on ~ #stage{opacity:0;pointer-events:none}
#lamps{position:fixed;inset:0;z-index:4;overflow:hidden;pointer-events:none;opacity:0}
#scene.on ~ #lamps.lit{opacity:1}
#lampFrame{position:absolute}
#lampFrame .base{position:absolute;left:0;top:0;width:100%;height:100%}
#lampFrame .lamp{position:absolute}
#sea{position:fixed;inset:0;width:100%;height:100%;z-index:5;cursor:pointer;background:#5eb8dc;transition:opacity 1.8s ease}
body:not(.moon) #stage,body:not(.moon) #msgwrap{visibility:hidden}
#seaMsg{position:fixed;left:0;right:0;z-index:6;text-align:center;letter-spacing:.1em;pointer-events:none;transition:opacity 1.8s ease;text-shadow:0 0 14px #04152b}
#seaTop{top:calc(env(safe-area-inset-top,0px) + 7vh);font-size:19px;line-height:1.9}
#seaBot{bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);font-size:14px;opacity:.7}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>

ity=".16" transform="rotate(18 128 84)"/><ellipse cx="74" cy="90" rx="8" ry="4" opacity=".12" transform="rotate(-55 74 90)"/></g></g></svg><div id="msg"><span class="tp">tap the moon</span></div></div>

<script>
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.opacity=.2+Math.random()*.6;document.body.appendChild(s)}
const $=id=>document.getElementById(id),stage=$('stage'),msg=$('msg'),form=$('form');
let step=0;
const gem=$('gem'),globe=$('globe');
const sea=$('sea'),sc=sea.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let seaDone=false,dpr=1;const spl=[],whirl=[{id:NaN},{id:NaN}];let lastT=0;
function retarget(side,id,W,H,m){
  if(id<0)return null;
  const s=whirl[side]; if(s.id===id)return s;
  const left=side===0,r=m*(left?0.15+Math.random()*.16:.08+Math.random()*.12);
  const padX=r+16,padY=r*.62+16;
  const x0=left?padX:W*.52,x1=left?W*.48:W-padX,y0=left?H*.16:H*.4,y1=left?H*.62:H*.84;
  s.id=id;s.r=r;
  s.x=Math.min(W-padX,Math.max(padX,x0+Math.random()*Math.max(8,x1-x0)));
  s.y=Math.min(H-padY,Math.max(padY,y0+Math.random()*Math.max(8,y1-y0)));
  return s;
}
function fit(){dpr=Math.min(devicePixelRatio||1,2);sea.width=innerWidth*dpr;sea.height=innerHeight*dpr;fitLamps()}
fit();addEventListener('resize',fit);
function gate(sec,shift){
  const x=(sec+shift)%8,f=.8;
  if(x<f)return x/f;
  if(x<4)return 1;
  if(x<4+f)return 1-(x-4)/f;
  return 0;
}
function vortex(x,y,R,dir,t,fade){
  if(fade<=.01)return;
  const g=sc.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,'rgba(8,22,58,'+(0.9*fade).toFixed(3)+')');g.addColorStop(.6,'rgba(14,36,78,'+(0.4*fade).toFixed(3)+')');g.addColorStop(1,'rgba(14,36,78,0)');
  sc.fillStyle=g;sc.beginPath();sc.ellipse(x,y,R,R*.62,0,0,7);sc.fill();
  sc.lineWidth=1.6;sc.lineCap='round';
  for(let k=0;k<5;k++){let px,py;
    for(let i=0;i<=60;i++){const u=i/60,r=R*(.06+.94*u),a=k*Math.PI*2/5+dir*(t*.55+(1-u)*6);
      const nx=x+Math.cos(a)*r,ny=y+Math.sin(a)*r*.62;
      if(i>0){sc.strokeStyle='rgba(176,206,232,'+(fade*.6*Math.pow(1-u,.7)).toFixed(3)+')';sc.beginPath();sc.moveTo(px,py);sc.lineTo(nx,ny);sc.stroke()}
      px=nx;py=ny}}
}
function drawSea(ts){
  if(seaDone)return;
  const t=ts/1000*(rm?.25:1),W=innerWidth,H=innerHeight;
  sc.setTransform(dpr,0,0,dpr,0,0);
  const bg=sc.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6cc8e8');bg.addColorStop(1,'#2a82b0');
  sc.fillStyle=bg;sc.fillRect(0,0,W,H);
  sc.lineWidth=1;sc.strokeStyle='rgba(240,252,255,.22)';
  for(let y=30;y<H;y+=68){sc.beginPath();for(let x=0;x<=W;x+=12){const yy=y+Math.sin(x/38+t*.7+y)*4;x?sc.lineTo(x,yy):sc.moveTo(x,yy)}sc.stroke()}
  const m=Math.min(W,H),sec=ts/1000+1.2,spin=rm?0:sec;
  const L=retarget(0,Math.floor(sec/8),W,H,m),R=retarget(1,Math.floor((sec-4)/8),W,H,m);
  sc.filter='blur(6px)';
  if(L)vortex(L.x,L.y,L.r,1,spin,gate(sec,0));
  if(R)vortex(R.x,R.y,R.r,-1,spin,gate(sec,4));
  sc.filter='none';
  const dt=Math.min(.05,Math.max(.008,t-lastT));lastT=t;
  if(Math.random()<.05){const lines=[];for(let y=30;y<H;y+=68)lines.push(y);const y0=lines[Math.floor(Math.random()*lines.length)],x=Math.random()*W,y=y0+Math.sin(x/38+t*.7+y0)*4;
    const hit=s=>s&&Math.pow((x-s.x)/s.r,2)+Math.pow((y-s.y)/(s.r*.62),2)<=1.3;
    if(!hit(L)&&!hit(R))spl.push({x,y,age:0,d:Array.from({length:7},()=>({vx:(Math.random()-.5)*46,vy:-(18+Math.random()*36),r:.8+Math.random()*1.5}))})}
  for(let i=spl.length-1;i>=0;i--){const s=spl[i];s.age+=dt;if(s.age>1.1){spl.splice(i,1);continue}
    const a=1-s.age/1.1;
    sc.strokeStyle='rgba(255,255,255,'+(a*.6).toFixed(3)+')';sc.lineWidth=1.2;sc.beginPath();sc.ellipse(s.x,s.y,4+s.age*26,(4+s.age*26)*.5,0,0,7);sc.stroke();
    sc.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    for(const d of s.d){sc.beginPath();sc.arc(s.x+d.vx*s.age,s.y+d.vy*s.age+80*s.age*s.age,d.r,0,7);sc.fill()}}
  requestAnimationFrame(drawSea);
}
requestAnimationFrame(drawSea);
sea.onclick=()=>{
  document.body.classList.add('moon');
  sea.style.opacity=0;document.querySelectorAll('.sm').forEach(e=>e.style.opacity=0);$('msgwrap').style.zIndex=12;
  setTimeout(()=>{seaDone=true;sea.style.display='none';document.querySelectorAll('.sm').forEach(e=>e.style.display='none')},1900)
};
function say(t){msg.style.opacity='1';msg.innerHTML=t}
stage.onclick=e=>{
  if(step!==0)return;
  const cant=e.target.id==='hitL';
  step=1;stage.className='half';
  $('hitL').style.pointerEvents='none';$('hitR').style.pointerEvents='none';
  say('The part of you that can’t love<br>is also you.');
  $(cant?'guard':'scene').classList.add('on');
  setTimeout(()=>{if(step===1){step=2;say('You have a half you haven’t shown yet.<br>Light it with one word.');form.style.display='flex'}},3800)
};
function fitLamps(){
  const frame=$('lampFrame'); if(!frame||typeof LAMP_FRAME==='undefined') return;
  const ir=LAMP_FRAME.w/LAMP_FRAME.h, vr=innerWidth/innerHeight;
  let w,h; if(ir>vr){h=innerHeight;w=h*ir}else{w=innerWidth;h=w/ir}
  frame.style.width=w+'px'; frame.style.height=h+'px';
  frame.style.left=(innerWidth-w)/2+'px'; frame.style.top=(innerHeight-h)/2+'px';
}
function mountLamps(){
  if(typeof LAMPS==='undefined') return;
  const root=document.createElement('div'); root.id='lamps';
  const frame=document.createElement('div'); frame.id='lampFrame';
  const base=document.createElement('img'); base.className='base'; base.src='lamps/base.png'; base.alt='';
  frame.appendChild(base);
  LAMPS.forEach(L=>{
    const im=document.createElement('img'); im.className='lamp'; im.src=L.src; im.alt='';
    im.style.left=(L.x/LAMP_FRAME.w*100)+'%'; im.style.top=(L.y/LAMP_FRAME.h*100)+'%';
    im.style.width=(L.w/LAMP_FRAME.w*100)+'%'; im.style.height=(L.h/LAMP_FRAME.h*100)+'%';
    frame.appendChild(im);
  });
  root.appendChild(frame); $('scene').insertAdjacentElement('afterend', root); fitLamps();
}
let lampsLit=false;
function fadeLanterns(){
  if(lampsLit) return; lampsLit=true;
  const box=$('lamps'); if(!box) return;
  fitLamps();
  const nodes=[...box.querySelectorAll('.lamp')];
  for(let i=nodes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=nodes[i]; nodes[i]=nodes[j]; nodes[j]=t}
  const span=2000;
  nodes.forEach((el,i)=>{el.style.transition='opacity 12s ease-in-out '+(nodes.length<2?0:span*i/(nodes.length-1))+'ms'});
  box.classList.add('lit');
  requestAnimationFrame(()=>requestAnimationFrame(()=>nodes.forEach(el=>{el.style.opacity='0'})));
}
function light(){
  fadeLanterns();
  const v=$('inp').value.trim()||'as I am';
  $('word').textContent=v;form.style.display='none';step=3;stage.className='full';
  say('Even unseen, it’s already round.<br>Whole, just as you are.');gem.style.opacity=0;globe.classList.add('on');stage.classList.add('spread');setTimeout(()=>{if(step===3)say('And this love reaches<br>everyone.')},5200);
  setTimeout(()=>{$('again').style.display='inline-block'},4000);
}
$('go').onclick=light;
$('inp').onkeydown=e=>{if(e.key==='Enter')light()};
$('again').onclick=()=>{
  const restart=seaDone;
  step=0;stage.className='';$('hitL').style.pointerEvents='';$('hitR').style.pointerEvents='';globe.classList.remove('on');gem.style.opacity=0;$('scene').classList.remove('on');$('guard').classList.remove('on');$('inp').value='';form.style.display='none';$('again').style.display='none';$('msgwrap').style.zIndex='';
  document.body.classList.remove('moon');
  seaDone=false;sea.style.display='';sea.style.opacity='1';
  document.querySelectorAll('.sm').forEach(e=>{e.style.display='';e.style.opacity=''});
  say('<span class="tp">tap the moon</span>');
  if(restart)requestAnimationFrame(drawSea);
};
mountLamps();
</script>
